<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Project Detail — A & G Roof Steel Builders completed steel construction and roofing projects.">
  <title>Project - A & G Roof Steel Builders</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div id="utility-bar-placeholder"></div>
<div id="header-placeholder"></div>

<!-- Project Detail -->
<main id="project-detail-main" class="project-detail-page">
  <div class="container">
    <div id="project-not-found" class="project-not-found" style="display: none;">
      <h2>Project Not Found</h2>
      <p>Sorry, the project you're looking for doesn't exist or has been moved.</p>
      <a href="projects.html" class="btn btn-primary">Browse All Projects</a>
    </div>
    <div id="project-content" style="display: none;">
      <p class="projects-breadcrumb" id="project-breadcrumb"></p>
      
      <h1 id="project-title" class="project-detail-title"></h1>
      
      <div class="project-detail-layout">
        <div class="project-gallery-wrap">
          <img id="project-main-image" src="" alt="" class="project-main-image">
          <div id="project-gallery" class="project-gallery"></div>
        </div>
        
        <div class="project-info-box">
          <div class="project-info-item">
            <span class="project-info-label"><i class="fas fa-map-marker-alt"></i> Location</span>
            <span id="project-location" class="project-info-value"></span>
          </div>
          <div class="project-info-item">
            <span class="project-info-label"><i class="fas fa-building"></i> Project Type</span>
            <span id="project-type" class="project-info-value"></span>
          </div>
          <div class="project-info-item">
            <span class="project-info-label"><i class="fas fa-calendar"></i> Year</span>
            <span id="project-year" class="project-info-value"></span>
          </div>
        </div>
        
        <div class="project-description-wrap">
          <h3>Project Description</h3>
          <div id="project-description" class="project-detail-description"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- CTA -->
<section class="cta-banner">
  <div class="container">
    <div class="cta-banner__inner">
      <div class="cta-banner__text">
        <h2>Have a Project in Mind?</h2>
        <p>Contact us for a free consultation and quote on your next steel construction project.</p>
      </div>
      <div class="cta-banner__actions">
        <a href="index.html#contact" class="btn btn-white">Get Free Quote</a>
        <a href="tel:+639123456789" class="btn btn-outline-white"><i class="fas fa-phone"></i> Call Us</a>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="js/projects-data.js"></script>
<script src="js/project-detail.js"></script>
<script src="js/main.js"></script>
</body>
</html>
