<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hardware accessories - tekscrews, rivets, sealant, drill bits, and insulation from A & G Roof Steel Builders.">
  <title>Hardware Accessories | A & G Roof Steel Builders</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div id="utility-bar-placeholder"></div>
<div id="header-placeholder"></div>

<!-- Hero -->
<section class="hero hero-generic hero-generic--hardware">
  <div class="container">
    <div class="hero-content">
      <h1 class="hero-title">Hardware Accessories</h1>
      <p class="hero-breadcrumb"><a href="index.html">Home</a> / <a href="products.html">Products</a> / Hardware Accessories</p>
    </div>
  </div>
</section>

<!-- Products Filter -->
<section class="products-filter-section">
  <div class="container">
    <div class="filter-tabs" id="filter-tabs"></div>

    <div id="product-filter-display" class="product-filter-display">
      <div class="product-filter-image-wrap">
        <img id="filter-product-image" src="" alt="" class="product-filter-image">
      </div>
      <div class="product-filter-info">
        <h2 id="filter-product-name" class="filter-product-title"></h2>
        <p id="filter-product-desc" class="filter-product-description"></p>
        
        <div id="filter-colors-section" class="filter-colors-section" style="display: none;">
          <h3 class="filter-colors-heading">Available Colors</h3>
          <div id="filter-color-list" class="filter-color-options"></div>
        </div>

        <div class="filter-product-specs" id="filter-product-specs" style="display: none;">
          <h3>Technical Specifications</h3>
          <table class="specs-table">
            <tbody id="filter-specs-body"></tbody>
          </table>
        </div>

        <div style="margin-top: 32px;">
          <a href="index.html#contact" class="btn btn-primary">Request a Quote <i class="fas fa-arrow-right"></i></a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- CTA Banner -->
<section class="cta-banner">
  <div class="container">
    <div class="cta-banner__inner fade-up">
      <div class="cta-banner__text">
        <h2>Need Help Choosing?</h2>
        <p>Our team can help you select the right products for your project.</p>
      </div>
      <div class="cta-banner__actions">
        <a href="index.html#contact" class="btn btn-white">Get Free Quote</a>
        <a href="tel:+639123456789" class="btn btn-outline-white"><i class="fas fa-phone"></i> Call Us</a>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="js/products-data.js"></script>
<script>
(function () {
  'use strict';

  var CATEGORY_KEY = 'hardware';

  var categoryProducts = [];
  var currentProduct = null;

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  function init() {
    if (!window.PRODUCTS_DATA || !window.PRODUCTS_DATA.products) return;

    for (var i = 0; i < window.PRODUCTS_DATA.products.length; i++) {
      var p = window.PRODUCTS_DATA.products[i];
      if (p.category === CATEGORY_KEY) {
        categoryProducts.push(p);
      }
    }

    renderTabs();

    if (categoryProducts.length > 0) {
      renderProduct(categoryProducts[0].id);
    }
  }

  function renderTabs() {
    var tabsContainer = document.getElementById('filter-tabs');
    var html = '';
    
    for (var i = 0; i < categoryProducts.length; i++) {
      var p = categoryProducts[i];
      html += '<button class="filter-tab' + (i === 0 ? ' active' : '') + '" data-product="' + p.id + '">' + escapeHtml(p.name) + '</button>';
    }
    
    tabsContainer.innerHTML = html;

    var tabs = tabsContainer.querySelectorAll('.filter-tab');
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].addEventListener('click', function () {
        var productId = this.getAttribute('data-product');
        
        for (var k = 0; k < tabs.length; k++) {
          tabs[k].classList.remove('active');
        }
        this.classList.add('active');
        
        renderProduct(productId);
      });
    }
  }

  function renderProduct(productId) {
    var product = null;
    for (var i = 0; i < categoryProducts.length; i++) {
      if (categoryProducts[i].id === productId) {
        product = categoryProducts[i];
        break;
      }
    }

    if (!product) return;

    currentProduct = product;

    var imgEl = document.getElementById('filter-product-image');
    imgEl.src = product.image;
    imgEl.alt = product.name;
    imgEl.style.filter = '';

    document.getElementById('filter-product-name').textContent = product.name;
    document.getElementById('filter-product-desc').textContent = product.description;

    var colorsSection = document.getElementById('filter-colors-section');
    var colorList = document.getElementById('filter-color-list');
    
    if (product.colors && product.colors.length > 0) {
      colorsSection.style.display = 'block';
      colorList.innerHTML = '';
      
      for (var c = 0; c < product.colors.length; c++) {
        var color = product.colors[c];
        var colorItem = document.createElement('div');
        colorItem.className = 'filter-color-item';
        colorItem.setAttribute('data-color', color.hex);
        colorItem.setAttribute('data-color-name', color.name);
        
        var swatch = document.createElement('span');
        swatch.className = 'filter-color-swatch';
        swatch.style.backgroundColor = color.hex;
        
        var name = document.createElement('span');
        name.className = 'filter-color-name';
        name.textContent = color.name;
        
        colorItem.appendChild(swatch);
        colorItem.appendChild(name);
        colorList.appendChild(colorItem);
      }

      var colorItems = colorList.querySelectorAll('.filter-color-item');
      for (var k = 0; k < colorItems.length; k++) {
        colorItems[k].addEventListener('click', function () {
          var colorHex = this.getAttribute('data-color');
          var colorName = this.getAttribute('data-color-name');
          applyColorFilter(colorHex, colorName);
        });
      }
    } else {
      colorsSection.style.display = 'none';
    }

    var specsSection = document.getElementById('filter-product-specs');
    var specsBody = document.getElementById('filter-specs-body');
    
    if (product.specs) {
      specsSection.style.display = 'block';
      specsBody.innerHTML = '';
      
      var specKeys = Object.keys(product.specs);
      for (var s = 0; s < specKeys.length; s++) {
        var key = specKeys[s];
        var row = document.createElement('tr');
        row.innerHTML = '<td class="spec-label">' + escapeHtml(key) + '</td><td class="spec-value">' + escapeHtml(product.specs[key]) + '</td>';
        specsBody.appendChild(row);
      }
    } else {
      specsSection.style.display = 'none';
    }
  }

  function applyColorFilter(colorHex, colorName) {
    var imgEl = document.getElementById('filter-product-image');
    imgEl.style.filter = 'hue-rotate(' + getHueRotation(colorHex) + 'deg) saturate(3) brightness(0.9)';
    imgEl.title = colorName + ' - Click to reset';
    
    imgEl.onclick = function () {
      imgEl.style.filter = '';
      imgEl.title = '';
      imgEl.onclick = null;
    };
  }

  function getHueRotation(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255;
    var g = parseInt(hex.slice(3, 5), 16) / 255;
    var b = parseInt(hex.slice(5, 7), 16) / 255;

    var max = Math.max(r, g, b);
    var min = Math.min(r, g, b);
    var h, s, l = (max + min) / 2;

    if (max === min) {
      h = s = 0;
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
        case g: h = ((b - r) / d + 2) / 6; break;
        case b: h = ((r - g) / d + 4) / 6; break;
      }
    }

    return Math.round(h * 360);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<script src="js/main.js"></script>
</body>
</html>
